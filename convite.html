<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite de Aniversário - João Miguel (1º Aninho)</title>
  <style>
    :root {
      --primary: #0056b3;
      --secondary: #d90429;
      --accent: #ffb703;
      --dark: #1a1a1a;
      --light: #f8f9fa;
      --success: #28a745;
      --danger: #dc3545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 4px solid var(--accent);
      animation: fadeInContainer 1s ease-out;
    }

    /* --- CORRIDA NO TOPO --- */
    .track-top {
      position: relative;
      background: #222;
      height: 75px;
      overflow: hidden;
      border-bottom: 4px solid var(--accent);
    }

    .road-lines {
      position: absolute;
      top: 50%;
      width: 200%;
      height: 4px;
      background: repeating-linear-gradient(90deg, #fff, #fff 20px, transparent 20px, transparent 40px);
      transform: translateY(-50%);
      animation: driveRoad 0.8s linear infinite;
    }

    .car-top-1 {
      position: absolute;
      top: 6px;
      left: -60px;
      font-size: 26px;
      animation: raceTop1 4s linear infinite;
    }

    .car-top-2 {
      position: absolute;
      bottom: 6px;
      left: -80px;
      font-size: 26px;
      animation: raceTop2 4.5s linear infinite 0.5s;
    }

    /* Imagem Principal */
    .img-wrapper {
      position: relative;
      overflow: hidden;
    }

    .header-img {
      width: 100%;
      display: block;
      animation: floatImage 3s ease-in-out infinite;
    }

    .content {
      padding: 20px;
      text-align: center;
    }

    .event-info {
      background: #f0f4f8;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      border-left: 5px solid var(--primary);
      text-align: left;
    }

    .event-info h3 {
      color: var(--primary);
      margin-bottom: 8px;
    }

    .event-info p {
      margin: 4px 0;
      font-size: 0.95rem;
    }

    .btn-maps {
      display: inline-block;
      margin-top: 10px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: var(--dark);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    .rsvp-options {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .rsvp-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .btn-yes { background-color: var(--success); }
    .btn-no { background-color: var(--danger); }

    .active-yes {
      outline: 4px solid #1e7e34;
      transform: scale(1.04);
    }

    .active-no {
      outline: 4px solid #bd2130;
      transform: scale(1.04);
    }

    .send-btn {
      width: 100%;
      background: #25d366;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
    }

    .counter-group {
      display: flex;
      gap: 10px;
    }

    .counter-group .form-group {
      flex: 1;
    }

    .presence-list-section {
      margin-top: 25px;
      border-top: 2px dashed #ccc;
      padding-top: 20px;
      text-align: left;
    }

    .presence-summary {
      display: flex;
      justify-content: space-between;
      background: #e9ecef;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .list-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-item.confirmed { border-left: 4px solid var(--success); }
    .list-item.declined { border-left: 4px solid var(--danger); }

    .badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: white;
    }

    .badge-yes { background: var(--success); }
    .badge-no { background: var(--danger); }

    /* --- LINHA DE CHEGADA NO RODAPÉ --- */
    .finish-footer {
      position: relative;
      background: #111;
      height: 70px;
      overflow: hidden;
      border-top: 4px solid var(--accent);
      margin-top: 20px;
    }

    .finish-line {
      position: absolute;
      right: 35px;
      top: 0;
      bottom: 0;
      width: 25px;
      background: repeating-linear-gradient(
        0deg,
        #fff,
        #fff 10px,
        #000 10px,
        #000 20px
      );
      box-shadow: -2px 0 5px rgba(0,0,0,0.5);
    }

    .winner-car {
      position: absolute;
      bottom: 15px;
      left: -60px;
      font-size: 32px;
      animation: finishRace 3.5s ease-out infinite;
    }

    .trophy-icon {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      animation: pulseTrophy 1s infinite alternate;
    }

    /* KEYFRAMES DAS ANIMAÇÕES */
    @keyframes driveRoad {
      from { transform: translate(0, -50%); }
      to { transform: translate(-40px, -50%); }
    }

    @keyframes raceTop1 {
      0% { left: -60px; }
      50% { left: 60%; }
      100% { left: 110%; }
    }

    @keyframes raceTop2 {
      0% { left: -60px; }
      40% { left: 30%; }
      70% { left: 75%; }
      100% { left: 110%; }
    }

    @keyframes finishRace {
      0% { left: -60px; opacity: 0; }
      20% { opacity: 1; }
      80% { left: calc(100% - 75px); }
      100% { left: calc(100% - 75px); }
    }

    @keyframes floatImage {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pulseTrophy {
      from { transform: translateY(-50%) scale(1); }
      to { transform: translateY(-50%) scale(1.2); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- CORRIDA DE CARRINHOS NO TOPO -->
  <div class="track-top">
    <div class="road-lines"></div>
    <div class="car-top-1">🏎️</div>
    <div class="car-top-2">🚗</div>
  </div>

  <!-- IMAGEM PRINCIPAL -->
  <div class="img-wrapper">
    <img src="convite.png.png" alt="Convite João Miguel" class="header-img">
  </div>

  <div class="content">
    <div class="event-info">
      <h3>🏁 Pit Stop do João Miguel</h3>
      <p>📅 <strong>Data:</strong> 21 de Novembro de 2026</p>
      <p>⏰ <strong>Horário:</strong> 18:00h</p>
      <p>📍 <strong>Local:</strong> Faculdade Pitágoras</p>
      <p>🗺️ <strong>Endereço:</strong> Rua 12 de Outubro, nº 377, BR-316</p>
      <a href="https://maps.google.com/?q=Faculdade+Pitágoras+Rua+12+de+Outubro+377+BR-316" target="_blank" class="btn-maps">Ver no GPS / Maps 📍</a>
    </div>

    <form id="rsvpForm">
      <div class="form-group">
        <label for="guestName">Seu Nome Completo:</label>
        <input type="text" id="guestName" placeholder="Digite seu nome..." required>
      </div>

      <div class="form-group">
        <label>Você vai comparecer?</label>
        <div class="rsvp-options">
          <button type="button" class="rsvp-btn btn-yes" onclick="selectPresence(true)">✔ SIM</button>
          <button type="button" class="rsvp-btn btn-no" onclick="selectPresence(false)">✖ NÃO</button>
        </div>
      </div>

      <div id="additionalFields" style="display: none;">
        <div class="counter-group">
          <div class="form-group">
            <label for="adultsCount">Adultos:</label>
            <input type="number" id="adultsCount" min="1" value="1">
          </div>
          <div class="form-group">
            <label for="kidsCount">Crianças:</label>
            <input type="number" id="kidsCount" min="0" value="0">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="message">Mensagem ao Aniversariante (Opcional):</label>
        <textarea id="message" rows="2" placeholder="Deixe um recado carinhoso..."></textarea>
      </div>

      <button type="submit" class="send-btn">
        📲 Enviar Confirmação via WhatsApp
      </button>
    </form>

    <div class="presence-list-section">
      <h3>📋 Lista de Respostas (Salva neste aparelho)</h3>
      <div class="presence-summary">
        <span>Confirmados: <strong id="totalConfirmed">0</strong></span>
        <span>Ausentes: <strong id="totalDeclined">0</strong></span>
      </div>
      <div id="presenceList"></div>
    </div>
  </div>

  <!-- CHEGADA DOS CARRINHOS NO RODAPÉ -->
  <div class="finish-footer">
    <div class="finish-line"></div>
    <div class="winner-car">🏎️💨</div>
    <div class="trophy-icon">🏆</div>
  </div>
</div>

<script>
  let isAttending = null;
  const whatsappTargetNumber = "559991770185";

  function selectPresence(status) {
    isAttending = status;
    const btnYes = document.querySelector('.btn-yes');
    const btnNo = document.querySelector('.btn-no');
    const additionalFields = document.getElementById('additionalFields');

    if (status) {
      btnYes.classList.add('active-yes');
      btnNo.classList.remove('active-no');
      additionalFields.style.display = 'block';
    } else {
      btnNo.classList.add('active-no');
      btnYes.classList.remove('active-yes');
      additionalFields.style.display = 'none';
    }
  }

  document.getElementById('rsvpForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('guestName').value.trim();
    const adults = document.getElementById('adultsCount').value;
    const kids = document.getElementById('kidsCount').value;
    const msg = document.getElementById('message').value.trim();

    if (isAttending === null) {
      alert("Por favor, selecione se irá comparecer (SIM ou NÃO).");
      return;
    }

    const entry = {
      name,
      attending: isAttending,
      adults: isAttending ? adults : 0,
      kids: isAttending ? kids : 0,
      msg,
      date: new Date().toLocaleTimeString()
    };
    
    saveLocally(entry);
    renderList();

    let text = `*Confirmação de Presença - 1º Aninho de João Miguel* 🏎️💨\n\n`;
    text += `👤 *Nome:* ${name}\n`;
    text += `❓ *Presença:* ${isAttending ? '✅ SIM, EU VOU!' : '❌ NÃO PODEREI IR'}\n`;
    
    if (isAttending) {
      text += `👨‍👩‍👧 *Adultos:* ${adults}\n`;
      text += `🧒 *Crianças:* ${kids}\n`;
    }
    
    if (msg) {
      text += `💬 *Recado:* "${msg}"\n`;
    }

    const encodedText = encodeURIComponent(text);
    const whatsappUrl = `https://api.whatsapp.com/send?phone=${whatsappTargetNumber}&text=${encodedText}`;
    
    window.open(whatsappUrl, '_blank');
  });

  function saveLocally(entry) {
    let list = JSON.parse(localStorage.getItem('rsvpList') || '[]');
    list.push(entry);
    localStorage.setItem('rsvpList', JSON.stringify(list));
  }

  function renderList() {
    let list = JSON.parse(localStorage.getItem('rsvpList') || '[]');
    const container = document.getElementById('presenceList');
    const confirmedEl = document.getElementById('totalConfirmed');
    const declinedEl = document.getElementById('totalDeclined');

    container.innerHTML = '';
    let confirmedCount = 0;
    let declinedCount = 0;

    list.forEach(item => {
      if (item.attending) confirmedCount++;
      else declinedCount++;

      const div = document.createElement('div');
      div.className = `list-item ${item.attending ? 'confirmed' : 'declined'}`;
      div.innerHTML = `
        <div>
          <strong>${item.name}</strong>
          ${item.attending ? `<br><small>Adultos: ${item.adults} | Crianças: ${item.kids}</small>` : ''}
        </div>
        <span class="badge ${item.attending ? 'badge-yes' : 'badge-no'}">
          ${item.attending ? 'CONFIRMADO' : 'AUSENTE'}
        </span>
      `;
      container.appendChild(div);
    });

    confirmedEl.textContent = confirmedCount;
    declinedEl.textContent = declinedCount;
  }

  renderList();
</script>

</body>
</html>
